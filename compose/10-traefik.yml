###############################################################################
#
# Traefik. Host ports 80 and 443 are the container listeners for a
# later HAProxy path and for local tests. They are not a public DNAT.
# The admin entrypoint is not published by this file.
#
###############################################################################

services:
  traefik:
    image: ${TRAEFIK_IMAGE:?TRAEFIK_IMAGE}
    container_name: lu-traefik
    hostname: lu-traefik
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - --configFile=/etc/traefik/traefik.yml
    networks:
      lu-proxy: {}
      lu-internal: {}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../runtime/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../runtime/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_DIR}/traefik/users:/etc/traefik/users:ro
      - ${DATA_DIR}/traefik/acme:/etc/traefik/acme
      - ${DATA_DIR}/traefik/logs:/var/log/traefik
      - ${DATA_DIR}/traefik/crowdsec:/etc/traefik/crowdsec:ro
    depends_on:
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"

###############################################################################
#
# Nginx in front of PHP-FPM. TLS is terminated by Traefik.
# This service has no host port.
#
###############################################################################

services:
  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE}
    container_name: lu-nginx
    hostname: lu-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../runtime/real-ip.conf:/etc/nginx/real-ip.conf:ro
      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html:ro
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data:ro
    depends_on:
      nextcloud:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/status.php | grep -q '"installed":true'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      lu-internal: {}
      lu-proxy: {}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"

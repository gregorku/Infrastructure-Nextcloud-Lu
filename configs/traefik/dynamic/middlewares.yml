http:
  middlewares:
    default-chain:
      chain:
        middlewares:
          - ip-whitelist
          - headers-default
          - headers-security
          - compress
          - auth-basic
    nextcloud-chain:
      chain:
        middlewares:
          - nextcloud-headers
          - crowdsec
          - rate-limit
          - compress
    auth-basic:
      basicAuth:
        realm: "Infrastructure-Nextcloud-Lu"
        usersFile: "/etc/traefik/users/dashboard.htpasswd"
    redirect-to-https:
      redirectScheme:
        scheme: https
        port: "443"
        permanent: true
    compress:
      compress: {}
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
